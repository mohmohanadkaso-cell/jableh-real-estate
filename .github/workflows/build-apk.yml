name: Build Jableh APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o jableh-real-estate-final-2026-v2.zip -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd extracted/jableh_real_estate_android
          gradle assembleRelease

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jableh-real-estate-release-apk
          path: extracted/jableh_real_estate_android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
