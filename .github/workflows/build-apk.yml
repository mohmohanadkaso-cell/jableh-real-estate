name: Build Jableh APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o jableh-real-estate-final-2026-v2.zip -d extracted
          echo "Files extracted:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        run: |
          find extracted -name gradlew -type f
          find extracted -name settings.gradle -o -name settings.gradle.kts

      - name: Build release APK
        run: |
          GRADLEW=$(find extracted -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found in uploaded ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jableh-real-estate-release-apk
          path: extracted/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
